apiVersion: v1
kind: ConfigMap
metadata:
  name: xeon-vllm-dashboard
  namespace: xeon-vllm
  labels:
    grafana_dashboard: "1"
data:
  xeon_vllm_overview.json: |
    {
      "id": null,
      "uid": "xeon-vllm-overview",
      "title": "Xeon vLLM Overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Request Throughput",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(vllm_request_success_total[1m]))", "legendFormat": "req/s", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "P95 Latency",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm_request_latency_seconds_bucket[1m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        }
      ]
    }
